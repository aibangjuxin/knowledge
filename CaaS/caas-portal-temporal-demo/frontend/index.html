<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CaaS Portal — ClusterRequest Submit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    /* demo dark theme — matches the deep-themed SVG style in /gcp diagrams */
    --bg: #0b1020;
    --panel: #131836;
    --panel-2: #1a2046;
    --border: #2c3460;
    --accent: #6f8bff;
    --accent-soft: #2c3460;
    --fg: #e6e9f5;
    --muted: #8b94c4;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --pending: #475569;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header .tag {
    color: var(--muted); font-size: 12px;
    border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px;
  }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 24px 32px;
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  section h2 { margin: 0 0 16px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 8px 10px;
    border-radius: 6px;
    font: inherit;
  }
  textarea { font-family: ui-monospace, monospace; font-size: 12px; }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px 4px;
    margin: 12px 0;
  }
  legend { padding: 0 8px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  button {
    margin-top: 16px;
    background: var(--accent);
    color: white; border: 0; border-radius: 6px;
    padding: 10px 16px; font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }

  /* Status visualization */
  .stage-list { display: flex; flex-direction: column; gap: 8px; }
  .stage {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: var(--panel-2);
    border-radius: 6px;
    border-left: 4px solid var(--pending);
  }
  .stage.succeeded { border-left-color: var(--ok); }
  .stage.running   { border-left-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .stage.failed    { border-left-color: var(--err); }
  .stage.blocked   { border-left-color: var(--warn); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.7 } }
  .stage .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pending); justify-self: center; }
  .stage.succeeded .dot { background: var(--ok); }
  .stage.running   .dot { background: var(--accent); }
  .stage.failed    .dot { background: var(--err); }
  .stage.blocked   .dot { background: var(--warn); }
  .stage .label { font-size: 13px; }
  .stage .state { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .stage .actor { font-size: 11px; color: var(--muted); }

  .summary { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; word-break: break-all; }

  .alert { padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 13px; }
  .alert.ok { background: rgba(74,222,128,0.12); border-left: 4px solid var(--ok); }
  .alert.err { background: rgba(248,113,113,0.12); border-left: 4px solid var(--err); }
  pre { margin: 0; font-size: 11px; line-height: 1.4; max-height: 220px; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>CaaS Portal</h1>
  <span class="tag">demo · auto-approval · stubbed K8S</span>
  <span class="tag" id="env-tag">TEMPORAL_ADDRESS=…</span>
</header>
<main>
  <!-- Form section -->
  <section>
    <h2>Submit ClusterRequest</h2>
    <label for="name">Cluster name</label>
    <input id="name" value="bbuk-team-a-prod" />

    <fieldset>
      <legend>Spec · cloud + region</legend>
      <label for="provider">cloudProvider</label>
      <select id="provider">
        <option value="gcp">gcp</option>
        <option value="aws">aws</option>
        <option value="aliyun">aliyun</option>
        <option value="onprem">onprem</option>
      </select>
      <label for="region">region</label>
      <input id="region" value="asia-east1" />
      <label for="tier">tier</label>
      <!-- ⚠️ C3 修复(2026-10-05):Autopilot 已从 CRD 移除,tier 锁死 standard。
           这里不给用户选择权 —— 让用户在 UI 里选一个后端必然拒绝的值是设计缺陷。
           若将来某画像要支持 Autopilot,应新增"画像选择"入口,而非在 tier 下拉框加选项。 -->
      <select id="tier" disabled>
        <option value="standard" selected>standard (DC 画像,平台锁定)</option>
      </select>
      <small>集群模式由平台画像决定;申请 Autopilot 需走新画像流程。</small>
    </fieldset>

    <fieldset>
      <legend>Compliance</legend>
      <label><input type="checkbox" id="fw-baseline" checked disabled> baseline (always on)</label>
      <label><input type="checkbox" id="fw-pci"> pci-dss (triggers security approval)</label>
      <label><input type="checkbox" id="fw-pip"> pip</label>
    </fieldset>

    <fieldset>
      <legend>Network (DC 画像要求 private)</legend>
      <label for="network-mode">mode</label>
      <select id="network-mode">
        <option value="private">private</option>
        <option value="public">public</option>
      </select>
      <label for="vpc">vpc</label>
      <input id="vpc" value="shared-vpc-prod" />
      <label for="subnet">subnet</label>
      <input id="subnet" value="bbuk-prod-subnet" />
    </fieldset>

    <fieldset>
      <legend>MultiTenancy</legend>
      <label for="isolation">isolationLevel</label>
      <select id="isolation">
        <option value="namespace">namespace</option>
        <option value="cluster">cluster</option>
      </select>
      <label for="teams">teams (comma separated)</label>
      <input id="teams" value="team-a,team-b" />
    </fieldset>

    <button id="submit-btn">Submit ClusterRequest</button>
    <div id="submit-result"></div>
  </section>

  <!-- Status section -->
  <section>
    <h2>Live status</h2>
    <div id="status-summary">
      <p style="color: var(--muted); font-size: 13px;">No request submitted yet.</p>
    </div>
    <div id="status-stages" class="stage-list" style="margin-top:16px"></div>
    <div id="status-event-log" style="margin-top:16px"></div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
  ? "http://localhost:8000"
  : "";  // same-origin behind nginx

// ClusterRequest body builder — matches api.models.ClusterRequestCreate
function buildPayload() {
  const frameworks = ["baseline"];
  if ($("fw-pci").checked) frameworks.push("pci-dss");
  if ($("fw-pip").checked) frameworks.push("pip");
  const teams = $("teams").value.split(",").map((s) => s.trim()).filter(Boolean);

  return {
    name: $("name").value,
    spec: {
      cloud_provider: $("provider").value,
      region: $("region").value,
      tier: $("tier").value,
      network: {
        mode: $("network-mode").value,
        vpc: $("vpc").value,
        subnet: $("subnet").value,
      },
      compliance: {
        frameworks,
        data_residency_region_constraint: "any",
      },
      gateway_strategy: {
        mode: "per-namespace",
        initial_shards: 3,
      },
      multi_tenancy: {
        isolation_level: $("isolation").value,
        teams,
      },
      cost_allocation: { rule: "usage-based", monthly_budget_usd: 5000 },
    },
  };
}

// Submit handler
$("submit-btn").addEventListener("click", async () => {
  const btn = $("submit-btn");
  const resultEl = $("submit-result");
  btn.disabled = true;
  resultEl.innerHTML = "";
  let resp;
  try {
    resp = await fetch(API + "/api/v1/requests", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(buildPayload()),
    });
  } catch (err) {
    resultEl.innerHTML = `<div class="alert err">Submit failed: ${err}</div>`;
    btn.disabled = false;
    return;
  }
  if (!resp.ok) {
    const txt = await resp.text();
    resultEl.innerHTML = `<div class="alert err">HTTP ${resp.status}: ${txt}</div>`;
    btn.disabled = false;
    return;
  }
  const data = await resp.json();
  resultEl.innerHTML = `
    <div class="alert ok">
      Workflow started: <code>${data.workflow_id}</code><br />
      Estimated monthly cost: $${data.estimated_monthly_cost_usd.toFixed(2)}
    </div>`;
  openStatusStream($("name").value);
  btn.disabled = false;
});

// SSE status stream
function openStatusStream(name) {
  const evtSrc = new EventSource(API + `/api/v1/requests/${encodeURIComponent(name)}/stream`);
  evtSrc.addEventListener("status", (e) => {
    const viz = JSON.parse(e.data);
    renderStatus(viz);
  });
  evtSrc.onerror = () => {
    console.warn("SSE stream closed");
    evtSrc.close();
  };
}

function renderStatus(viz) {
  const sumEl = $("status-summary");
  const stagesEl = $("status-stages");
  const eventEl = $("status-event-log");

  // Summary
  sumEl.innerHTML = `
    <dl class="summary">
      <dt>request</dt><dd>${viz.request_name}</dd>
      <dt>workflow</dt><dd><code style="font-size:11px">${viz.workflow_id}</code></dd>
      <dt>current stage</dt><dd>${viz.current_stage} · <span style="color:var(--${viz.current_state==='succeeded'?'ok':viz.current_state==='failed'?'err':viz.current_state==='running'?'accent':'muted'})">${viz.current_state}</span></dd>
      <dt>elapsed</dt><dd>${viz.elapsed_seconds.toFixed(1)}s / ~${viz.expected_total_seconds}s</dd>
      ${viz.next_action ? `<dt>next</dt><dd>${viz.next_action}</dd>` : ""}
      ${viz.blocked_reason ? `<dt>blocked</dt><dd style="color:var(--err)">${viz.blocked_reason}</dd>` : ""}
    </dl>
  `;

  // Stages
  stagesEl.innerHTML = viz.stages.map((s) => `
    <div class="stage ${s.state}">
      <span class="dot"></span>
      <div>
        <div class="label">${s.label}</div>
        ${s.detail ? `<div class="actor">${s.detail}</div>` : ""}
        ${s.actor ? `<div class="actor">${s.actor}</div>` : ""}
      </div>
      <span class="state">${s.state}</span>
    </div>
  `).join("");

  // Decide on banner
  const terminal = viz.current_state === "succeeded" && viz.current_stage === "ready";
  if (terminal) {
    eventEl.innerHTML = `<div class="alert ok">Cluster is <strong>Ready</strong>.</div>`;
  } else if (viz.current_state === "failed") {
    eventEl.innerHTML = `<div class="alert err">Workflow failed at stage <code>${viz.current_stage}</code>. Check server logs.</div>`;
  } else {
    eventEl.innerHTML = "";
  }
}

// On load: poll last known status so reloading the page shows progress.
(async () => {
  try {
    const r = await fetch(API + "/healthz");
    $("env-tag").textContent = r.ok ? "API ✓ healthy" : "API ✗ unhealthy";
  } catch {
    $("env-tag").textContent = "API ✗ offline";
  }
})();
</script>
</body>
</html>
