# =============================================================================
# 04-serviceaccounts.yaml
# =============================================================================
# KSA —— 本 PoC 只需要两个:
#   - lex-api2-ksa : 被调方
#   - lex-api1-ksa : 调用方(身份会被 AuthorizationPolicy 引用)
#
# 严格定义 (ambient 与 SA 的关系):
#   "ambient mode does not require a special SA for istiod communication
#    (ztunnel handles mTLS). However, KSA is still required for GCP API
#    access and RBAC."
#   — Istio Ambient docs
#
# 关键: 调用方的 SA 名字会出现在 AuthorizationPolicy 的 source.principals 里
#       格式 = cluster.local/ns/<ns>/sa/<sa-name>
#       所以 SA 名一旦被策略引用就不要再改
#
# ⚠️ 本 PoC 不绑 Workload Identity(没调 GCP API 的需求),
#    所以不写 iam.gke.io/gcp-service-account 注解。
#    真实业务要调 GCS/BigQuery 时再补,参考 ../case-lex/06-app-serviceaccount.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lex-api2-ksa
  namespace: ba000000-lex-intra-call
  labels:
    app: lex-api2
    app.kubernetes.io/part-of: ba000000-lex-intra-call
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lex-api1-ksa
  namespace: ba000000-lex-intra-call
  labels:
    app: lex-api1
    app.kubernetes.io/part-of: ba000000-lex-intra-call
automountServiceAccountToken: true
