# =============================================================================
# 06-app-serviceaccount.yaml
# =============================================================================
# KSA (Kubernetes Service Account) + Workload Identity 绑定占位
#
# 业务需要调 GCS / BigQuery (Lex 答复 Q2)
#   → 必须有 KSA + GSA + Workload Identity binding
#   → 不能直接用 default SA (权限太大)
#
# 设计依据:
#   - 严格定义 (GKE Workload Identity docs):
#     "Workload Identity binds a Kubernetes Service Account (KSA) to a
#      Google Service Account (GSA), allowing Kubernetes workloads to
#      impersonate the GSA when accessing Google Cloud APIs."
#   - 严格定义 (ambient mesh):
#     "ambient mode does not require a special SA for istiod communication
#      (ztunnel handles mTLS). However, KSA is still required for GCP API
#      access and RBAC."
#
# 三步流程:
#   1. 创建 KSA (本文件)
#   2. 创建 GSA (gcloud 命令, 不在本文件)
#   3. 绑定 KSA → GSA (gcloud iam service-accounts add-iam-policy-binding)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-ksa
  namespace: ba000000-lex-int
  labels:
    app: app
    app.kubernetes.io/name: app
    # Workload Identity 标识 (GKE 自动识别这个 annotation 决定 GSA 绑定)
    # GSA name 占位 — 实际值由 gcloud 命令创建时决定
    iam.gke.io/gcp-service-account: app-gsa@aibang-12345678-ajbx-dev.iam.gserviceaccount.com
  annotations:
    # Workload Identity binding 必须的 annotation
    # iam.gke.io/gcp-service-account 的格式: <GSA>@<PROJECT>.iam.gserviceaccount.com
    iam.gke.io/gcp-service-account: app-gsa@aibang-12345678-ajbx-dev.iam.gserviceaccount.com
automountServiceAccountToken: true   # 必须 true, pod 才能用这个 SA