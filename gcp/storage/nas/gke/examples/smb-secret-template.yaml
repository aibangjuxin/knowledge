# infra-gcp 专用:K8s Secret 模板(SMB 凭据)
# ⚠ 关键:凭据不能写进 manifest 提交到 git,必须用以下方式之一创建:
#   A. kubectl create secret ... --from-literal=... (CLI 创建,不入 git)
#   B. Sealed Secrets / External Secrets Operator (生产推荐)
#   C. Workload Identity + IAM (本场景不适用,NAS 凭据是 AD 账号)
# 架构师 lane:本文档只生成模板,不执行 apply(尤其是不在 git 里提交真实凭据)

# ⚠ 以下 YAML 仅展示结构,真实凭据必须从 IT 拿,不要写在这里
apiVersion: v1
kind: Secret
metadata:
  name: smb-secret
  namespace: api-ns
  labels:
    tenant: tnt-001
type: Opaque
stringData:                       # ← stringData(不是 data),值用明文,k8s 自动 base64
  username: "<SMB_USERNAME>"      # ← 从 IT 拿,不要 hardcode
  password: "<SMB_PASSWORD>"      # ← 从 IT 拿,不要 hardcode
# ⚠ 提交到 git 之前:删除 stringData 字段(或用 # 占位)
# ⚠ 部署命令示例(infra-gcp 跑):
#   kubectl create secret generic smb-secret -n api-ns \
#     --from-literal=username=svc-nas-readonly \
#     --from-literal=password='<from IT>'