# 业务方专用:API Deployment YAML(挂 NFS)
# ⚠ 必须先走 PM 评估 + 6 阻塞问题,见 ADR-009 §1.3
# 架构师 lane:本文档只生成模板,不执行 apply

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-with-nfs                 # ← 业务方命名
  namespace: api-ns                  # ← 业务方指定 namespace
  labels:
    app: api
    role: nfs-consumer              # ← 必须有,NetworkPolicy 用
    tenant: tnt-001                  # ← 业务方 tenant ID
spec:
  replicas: 1                        # ← 默认 1,不要随便改
  selector:
    matchLabels:
      app: api
      role: nfs-consumer
  template:
    metadata:
      labels:
        app: api
        role: nfs-consumer
        tenant: tnt-001
    spec:
      # NFS 场景不需要 serviceAccountName(NFS 不调 GCP API)
      # NFS 场景不需要 Secret mount(NFS 无凭据)
      containers:
      - name: api
        image: <业务方镜像:tag>      # ← 业务方填,固定 tag
        ports:
        - containerPort: 8080
        env:
        - name: MOUNT_PATH
          value: /mnt/nfs
        # ⚠ 红线 2:不要 hardcode NFS 文件路径
        # ⚠ 红线 2:应用代码不能写 logger.info(f"read {filepath}")
        volumeMounts:
        - name: nfs-app-folder
          mountPath: /mnt/nfs
          readOnly: true             # ← ADR-009 §6.3 默认 ro,改 false 需 PM 评估
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nfs-app-folder
        persistentVolumeClaim:
          claimName: pvc-nfs-app      # ← infra-gcp 创建的 PVC
      # ⚠ 红线 4:不要 configMapRef / secretRef 引用 NFS 内容