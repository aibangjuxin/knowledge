# gatekeeper · base（策略本体，所有集群共用）
#
# ⭐ 这里只放「策略本身」，不放：
#    · 强制力度（dryrun / deny）  → 由 overlays/env/<env>/ 决定
#    · 集群特有的豁免            → 由 overlays/cluster/<cluster>/ 决定
#
# ⚠️ Gatekeeper **控制面**（controller / webhook / CRD）不在这里，
#    它由 Helm 装一次。本组件只管**策略**。

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - constrainttemplate.yaml
  - constraint.yaml
