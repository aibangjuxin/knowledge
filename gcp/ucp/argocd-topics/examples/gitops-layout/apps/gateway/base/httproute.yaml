# Gateway API · HTTPRoute（域名 → 后端）
#
# backendRefs 指向的 nginx Service 由**另一个 Application** 管理
# （nginx-<cluster>，见 bootstrap/applicationsets/component-nginx.yaml）。
# 跨 Application 引用是允许的：HTTPRoute 只按名字解析 Service。
#
# ⚠️ 域名是集群级差异 → 由 overlays/cluster/<cluster>/ 打补丁覆盖。

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: gateway
spec:
  parentRefs:
    - name: edge-gateway
  hostnames:
    - nginx.dev.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
