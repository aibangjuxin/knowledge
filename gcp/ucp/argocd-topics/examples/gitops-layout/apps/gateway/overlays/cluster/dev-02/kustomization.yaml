# gateway · cluster 层 · dev-02
#
# dev-02 用自己的域名 —— 和 dev-01 完全独立，互不影响。

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../env/dev

patches:
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nginx
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: nginx.dev-02.example.com
