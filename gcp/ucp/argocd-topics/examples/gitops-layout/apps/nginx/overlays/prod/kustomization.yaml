# nginx · prod overlay

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: nginx
    count: 3

labels:
  - pairs:
      app.kubernetes.io/instance: nginx-prod
      app.kubernetes.io/environment: prod
    includeSelectors: false

patches:
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
