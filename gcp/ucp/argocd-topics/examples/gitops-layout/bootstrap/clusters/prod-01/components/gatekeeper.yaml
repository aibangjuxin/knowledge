# 组件启用清单：prod-01 × gatekeeper
#
# prod 的 OPA 策略：环境层是 **deny**（真拦），集群层再放本集群的豁免。
# ⚠️ 切 deny 之前先确认 Gatekeeper 控制面 failurePolicy=Fail 且 ≥2 副本 + PDB，
#    否则 webhook 挂掉 = 整个集群写不进去。

component: gatekeeper
cluster: prod-01
server: https://prod-01.k8s.example.com
env: prod
project: platform-prod
namespace: platform-prod
