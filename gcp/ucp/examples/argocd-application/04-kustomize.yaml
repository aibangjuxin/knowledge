# 例 4 · Kustomize：环境差异用 overlay 表达，不复制两份 YAML
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:YOUR_ORG/infra.git
    targetRevision: main
    path: envs/dev
    kustomize:
      namePrefix: dev-
      images:
        - my-app=gcr.io/my-repo/my-app:0.1
      replicas:
        - name: my-app
          count: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app-dev
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
