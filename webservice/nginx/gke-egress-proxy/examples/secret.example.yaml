# ==============================================================================
# 凭证示例。生产环境请用 External Secrets / Secret Manager 同步，不要提交到 Git。
#
# 1) nginx → 中间服务的共享令牌（可选）
#    挂载后内容形如：set $internal_token "真实令牌";
#    nginx.conf 中通过 include /etc/nginx/secrets/*.conf; 读取
# 2) 中间服务 → 第三方 API 的令牌
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nginx-egress-proxy-credentials
  namespace: platform-net
type: Opaque
stringData:
  partner.conf: |
    set $internal_token "REPLACE_WITH_INTERNAL_SHARED_TOKEN";
---
apiVersion: v1
kind: Secret
metadata:
  name: partner-credentials
  namespace: platform-net
type: Opaque
stringData:
  token: "REPLACE_WITH_PARTNER_API_TOKEN"
