# ==============================================================================
# 验证客户端：在 app-workload 命名空间里跑一个 Pod，验证
#   ① 经代理能访问到外部   ② 直连外网已被 NetworkPolicy 拦截
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: egress-test-client
  namespace: app-workload
  labels:
    app.kubernetes.io/name: egress-test-client
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - |
          set -x
          echo "=== ① 代理健康检查（从业务 Pod 侧） ==="
          curl -sS -m 5 -o /dev/null -w "healthz=%{http_code}\n" http://nginx-egress-proxy.platform-net.svc.cluster.local:8081/healthz || true
          echo "=== ② 经代理访问外部（应返回 200 与上游内容） ==="
          curl -sS -m 15 -H "X-Caller-Identity: test-client" http://nginx-egress-proxy.platform-net.svc.cluster.local:8082/proxy || true
          echo
          echo "=== ③ 直连外网（应失败：被 NetworkPolicy 拦截） ==="
          curl -sS -m 5 -o /dev/null -w "direct=%{http_code}\n" https://api.partner.example.com/ ; echo "direct_exit=$?"
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
